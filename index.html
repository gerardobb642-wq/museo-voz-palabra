<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La voz y la palabra · Museo virtual</title>
<meta name="description" content="Museo virtual en 3D de literatura en español: seis salas, de la Edad Media al Naturalismo.">
<link rel="preload" href="fonts/IbarraRealNova.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/museo.css">
<script type="importmap">{ "imports": { "three": "./js/three.module.min.js" } }</script>
</head>
<body>
<canvas id="scene" aria-label="Recorrido en 3D del museo"></canvas>

<header class="hud" id="hud" hidden>
  <p class="hud-sala" id="hudSala">Vestíbulo</p>
  <nav class="hud-nav">
    <button type="button" id="btnPlano">Plano</button>
    <button type="button" id="btnRefs">Referencias</button>
  </nav>
</header>
<p class="hint" id="hint" hidden>Arrastra para mirar. Toca el piso para caminar y una obra para verla.</p>

<div class="loading" id="loading">
  <p class="loading-title">La voz y la palabra</p>
  <p class="loading-pct">Cargando el museo, <span id="loadPct">0%</span></p>
</div>

<div class="sheet" id="plano" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2>Plano</h2><button type="button" class="x" data-close>Cerrar</button></div>
    <ol class="plano-rooms" id="planoRooms"></ol>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <article class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="card"></article>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
